<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#5B3FD8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SPEAKLY" />
<title>SPEAKLY — Learn less. Speak more.</title>
<meta name="description" content="SPEAKLY : commence à PARLER la langue que tu apprends, 5 minutes par jour." />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<!-- Aucune police distante : la pile système est utilisée (l'app doit fonctionner
     sans réseau, et une requête vers un CDN casse cette promesse). -->
<link rel="stylesheet" href="css/styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%235B3FD8'/><g fill='white'><rect x='22' y='42' width='7' height='16' rx='3.5'/><rect x='34' y='32' width='7' height='36' rx='3.5'/><rect x='46' y='24' width='7' height='52' rx='3.5'/><rect x='58' y='34' width='7' height='32' rx='3.5'/><rect x='70' y='44' width='7' height='12' rx='3.5'/></g></svg>" />
</head>
<body>

<!-- ============ DESKTOP / TABLET SHELL ============ -->
<div class="shell" id="shell">
  <aside class="shell-side" id="shellSide">
    <div class="shell-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 100 100"><g fill="currentColor"><rect x="22" y="42" width="7" height="16" rx="3.5"/><rect x="34" y="32" width="7" height="36" rx="3.5"/><rect x="46" y="24" width="7" height="52" rx="3.5"/><rect x="58" y="34" width="7" height="32" rx="3.5"/><rect x="70" y="44" width="7" height="12" rx="3.5"/></g></svg>
      </span>
      <div>
        <strong>SPEAKLY</strong>
        <small>Learn less. Speak more.</small>
      </div>
    </div>
    <nav class="shell-nav" id="shellNav" aria-label="Navigation principale"></nav>
    <div class="shell-tip" id="shellTip"></div>
  </aside>

  <main class="shell-main">
    <div class="device" id="device">
      <div class="device-notch" aria-hidden="true"></div>
      <div class="statusbar" aria-hidden="true">
        <span id="statusTime">9:41</span>
        <span class="statusbar-ico">
          <svg viewBox="0 0 20 12" width="17" height="11"><path fill="currentColor" d="M1 8h2v4H1zM5 6h2v6H5zM9 4h2v8H9zM13 2h2v10h-2z"/></svg>
          <svg viewBox="0 0 16 12" width="15" height="11"><path fill="currentColor" d="M8 9.5a1.6 1.6 0 100 3.2 1.6 1.6 0 000-3.2zM8 5.4c-1.6 0-3 .6-4.1 1.6l1.2 1.3A4.4 4.4 0 018 7.2c1.1 0 2.1.4 2.9 1.1l1.2-1.3A5.9 5.9 0 008 5.4zm0-4C5.4 1.4 3 2.4 1.2 4.1l1.2 1.3A7.3 7.3 0 018 3.2c2.1 0 4 .8 5.4 2.2l1.2-1.3A8.9 8.9 0 008 1.4z"/></svg>
          <svg viewBox="0 0 26 12" width="24" height="11"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="1.6" fill="currentColor"/><rect x="23" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg>
        </span>
      </div>

      <!-- every screen is rendered here -->
      <div class="viewport" id="view" role="main"></div>

      <nav class="tabbar" id="tabbar" aria-label="Onglets"></nav>
      <div class="homebar" aria-hidden="true"></div>

      <!-- ============ OVERLAYS ============
           Placés DANS le cadre : ils se positionnent par rapport à l'app et non
           à la fenêtre. Sur téléphone le cadre est plein écran, sur desktop le
           panneau et les toasts restent donc dans la frame du téléphone. -->
      <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
      <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Panneau">
        <div class="sheet-grip" id="sheetGrip" aria-hidden="true"></div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
      <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
      <div class="celebrate" id="celebrate" hidden></div>
    </div>
    <p class="shell-hint" id="shellHint">Astuce : ouvre cette page sur ton téléphone et ajoute-la à l'écran d'accueil.</p>
  </main>
</div>

<noscript><p style="padding:24px;font-family:sans-serif">SPEAKLY a besoin de JavaScript pour fonctionner.</p></noscript>

<script src="js/screens/profile.js"></script>
<script src="js/app.js"></script>
</body>
</html>
